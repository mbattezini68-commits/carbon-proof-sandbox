<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1117">
    <title>Carbon Proof Acre Protocol (BCA)</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: monospace;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 680px;
            background: #161b22;
            padding: 28px;
            border-radius: 6px;
            border: 1px solid #30363d;
        }
        h2 { color: #58a6ff; margin-top: 0; margin-bottom: 5px; }
        .subtitle { color: #8b949e; font-size: 0.9em; margin-top: 0; margin-bottom: 20px; border-bottom: 1px solid #30363d; padding-bottom: 12px; }
        label { display: block; margin-top: 14px; font-weight: bold; font-size: 0.9em; color: #e6edf3; }
        .row { display: flex; gap: 10px; }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 4px;
            font-family: monospace;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            background: #238636;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            font-family: monospace;
        }
        button:hover { background: #2ea043; }
        .result {
            margin-top: 25px;
            background: #0d1117;
            border: 1px solid #30363d;
            padding: 20px;
            border-radius: 4px;
            display: none;
        }
        .metric-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }
        .metric-card {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 10px;
            border-radius: 4px;
        }
        .metric-label { font-size: 0.78em; color: #8b949e; display: block; }
        .metric-val { font-size: 1.05em; font-weight: bold; color: #e6edf3; margin-top: 4px; display: block; }
        .laudo-box {
            margin-top: 16px;
            padding: 14px;
            background: #161b22;
            border-left: 4px solid #58a6ff;
            font-size: 0.9em;
            line-height: 1.5;
            color: #e6edf3;
        }
        .hash-box {
            margin-top: 14px;
            padding: 10px;
            background: #161b22;
            border: 1px dashed #30363d;
            font-size: 0.8em;
            color: #8b949e;
            word-break: break-all;
        }
        @media (max-width: 560px) {
            .row { flex-direction: column; gap: 4px; }
            .row .inline-pair { display: flex; flex-direction: row; gap: 8px; }
        }
        .inline-pair { display: flex; gap: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Carbon Proof Acre Protocol (BCA)</h2>
    <p class="subtitle">Oráculo de Auditoria e Validação de Conformidade Física</p>
    
    <form id="auditForm" onsubmit="event.preventDefault(); submeterAuditoria();">
        
        <div>
            <label>Registro Público:</label>
            <input type="text" id="registroPublico" placeholder="Ex: Verra VCS-984, Gold Standard GS-8820 (ou deixe em branco)">
        </div>

        <div class="row">
            <div style="flex: 1;">
                <label>Latitude:</label>
                <div class="inline-pair">
                    <input type="number" step="any" id="latVal" placeholder="Ex: 3.1190" required>
                    <select id="latDir" style="max-width: 115px;">
                        <option value="N">Norte (N)</option>
                        <option value="S" selected>Sul (S)</option>
                    </select>
                </div>
            </div>
            <div style="flex: 1;">
                <label>Longitude:</label>
                <div class="inline-pair">
                    <input type="number" step="any" id="lonVal" placeholder="Ex: 60.0217" required>
                    <select id="lonDir" style="max-width: 115px;">
                        <option value="E">Leste (E)</option>
                        <option value="W" selected>Oeste (W)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="row">
            <div style="flex: 1.5;">
                <label>Área:</label>
                <div class="inline-pair">
                    <input type="number" step="any" id="areaValor" placeholder="Ex: 50000" required>
                    <select id="areaUnidade" style="max-width: 195px;">
                        <option value="M2">Metro Quadrado (m²)</option>
                        <option value="HA" selected>Hectare (ha)</option>
                        <option value="KM2">Quilómetro Quadrado (km²)</option>
                        <option value="ACRE">Acre Internacional (ac)</option>
                        <option value="MI2">Milha Quadrada (mi²)</option>
                        <option value="ALQ_SP">Alqueire Paulista</option>
                        <option value="ALQ_MG">Alqueire Mineiro / Goiano</option>
                        <option value="ALQ_NORTE">Alqueire do Norte</option>
                        <option value="ALQ_BA">Alqueire Baiano</option>
                    </select>
                </div>
            </div>
            <div style="flex: 1;">
                <label>tCO2:</label>
                <input type="number" step="any" id="creditos" placeholder="Ex: 450000" value="0" required>
            </div>
        </div>

        <button type="submit">Executar Auditoria</button>
    </form>

    <div id="resultBox" class="result">
        <div style="font-weight: bold; font-size: 1.05em; margin-bottom: 8px;">
            ESTADO DO PROTOCOLO: <span id="resStatus">-</span>
        </div>

        <div class="metric-grid">
            <div class="metric-card">
                <span class="metric-label">CONTINENTE DE REFERÊNCIA</span>
                <span class="metric-val" id="resRegiao">-</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">LIMITE FÍSICO ANUAL</span>
                <span class="metric-val" id="resTeto">-</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">BALANÇO AUDITADO</span>
                <span class="metric-val" id="resBalanco">-</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">DESVIO APURADO</span>
                <span class="metric-val" id="resDesvio">-</span>
            </div>
        </div>

        <div class="laudo-box" id="laudoBorder">
            <strong>LAUDO TÉCNICO PERICIAL:</strong><br>
            <span id="resLaudo">-</span>
        </div>

        <div class="hash-box">
            <strong>PROVA CRIPTOGRÁFICA DE INTEGRIDADE (SHA-256):</strong><br>
            <span id="resHash">-</span><br>
            <span id="resTs" style="font-size: 0.9em;">-</span>
        </div>
    </div>
</div>

<script>
const FATORES_AREA_M2 = {
    "M2": 1.0,
    "HA": 10000.0,
    "KM2": 1000000.0,
    "ACRE": 4046.8564224,
    "MI2": 2589988.110336,
    "ALQ_SP": 24200.0,
    "ALQ_MG": 48400.0,
    "ALQ_NORTE": 27225.0,
    "ALQ_BA": 96800.0
};

function converterParaM2(valor, unidade) {
    const fator = FATORES_AREA_M2[unidade] || 10000.0;
    return valor * fator;
}

function formatarNumero(val) {
    if (Math.abs(val) > 0 && Math.abs(val) < 1) {
        return val.toLocaleString('pt-BR', { minimumFractionDigits: 4, maximumFractionDigits: 6 });
    }
    return val.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

async function submeterAuditoria() {
    const regTexto = document.getElementById('registroPublico').value.trim();
    const areaVal = parseFloat(document.getElementById('areaValor').value);
    const areaUnit = document.getElementById('areaUnidade').value;
    const areaM2 = converterParaM2(areaVal, areaUnit);

    const payload = {
        registro_publico: regTexto,
        latitude: parseFloat(document.getElementById('latVal').value),
        lat_dir: document.getElementById('latDir').value,
        longitude: parseFloat(document.getElementById('lonVal').value),
        lon_dir: document.getElementById('lonDir').value,
        area_valor: areaVal,
        area_unidade: areaUnit,
        area_m2: areaM2,
        area_hectares: areaM2 / 10000.0,
        creditos_emitidos: parseFloat(document.getElementById('creditos').value)
    };

    let dados;
    try {
        const resp = await fetch('/api/v1/audit-publico', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        dados = await resp.json();
    } catch (e) {
        dados = processarAuditoriaLocal(payload);
    }

    exibirLaudo(dados);
}

function exibirLaudo(d) {
    const statusEl = document.getElementById('resStatus');
    const laudoBorder = document.getElementById('laudoBorder');
    statusEl.innerText = d.status_protocolo;

    if (d.status_protocolo.includes("REJEITADO")) {
        statusEl.style.color = "#f85149";
        laudoBorder.style.borderLeftColor = "#f85149";
    } else if (d.status_protocolo.includes("PARCIAL")) {
        statusEl.style.color = "#d29922";
        laudoBorder.style.borderLeftColor = "#d29922";
    } else {
        statusEl.style.color = "#3fb950";
        laudoBorder.style.borderLeftColor = "#3fb950";
    }

    document.getElementById('resRegiao').innerText = d.indexador_regional;
    document.getElementById('resTeto').innerText = formatarNumero(d.teto_fisico_anual_t) + " tCO2";
    document.getElementById('resBalanco').innerText = formatarNumero(d.balanco_auditado_t) + " tCO2";
    document.getElementById('resDesvio').innerText = d.desvio_percentual.toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + " %";
    document.getElementById('resLaudo').innerText = d.laudo_tecnico;
    document.getElementById('resHash').innerText = d.prova_criptografica_sha256;
    document.getElementById('resTs').innerText = "TIMESTAMP UTC: " + d.timestamp_utc;

    document.getElementById('resultBox').style.display = 'block';
}

async function gerarSHA256Hex(texto) {
    const msgBuffer = new TextEncoder().encode(texto);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

function processarAuditoriaLocal(req) {
    const ts = new Date().toISOString();
    if (Math.abs(req.latitude) > 90 || Math.abs(req.longitude) > 180 || req.area_m2 <= 0 || req.creditos_emitidos < 0) {
        return {
            status_protocolo: "REJEITADO (PARÂMETROS INVÁLIDOS)",
            indexador_regional: "FORA_DA_MALHA",
            teto_fisico_anual_t: 0,
            balanco_auditado_t: 0,
            desvio_percentual: 100.0,
            laudo_tecnico: "[ESTADO: BLOQUEADO] Os parâmetros inseridos violam os limites físicos e geográficos admitidos pelo protocolo. Auditoria rejeitada.",
            prova_criptografica_sha256: "ERR_OUT_OF_BOUNDS_" + Date.now().toString(16),
            timestamp_utc: ts
        };
    }

    const lat = (req.lat_dir === 'S') ? -Math.abs(req.latitude) : Math.abs(req.latitude);
    const lon = (req.lon_dir === 'W') ? -Math.abs(req.longitude) : Math.abs(req.longitude);

    let regiaoNome = "CONTINENTE ASIÁTICO-OCEÂNICO";
    if (lon >= -170 && lon < -30 && lat < 15) regiaoNome = "CONTINENTE SUL-AMERICANO";
    else if (lon >= -170 && lon < -30 && lat >= 15) regiaoNome = "CONTINENTE NORTE-AMERICANO";
    else if (lon >= -30 && lon < 60 && lat >= 35) regiaoNome = "CONTINENTE EUROPEU";
    else if (lon >= -30 && lon < 60 && lat < 35) regiaoNome = "CONTINENTE AFRICANO / ORIENTAL";

    const areaHa = req.area_m2 / 10000.0;
    const tetoAjustado = areaHa * 14.85;
    const balanco = tetoAjustado - req.creditos_emitidos;
    const desvio = (tetoAjustado > 0 && req.creditos_emitidos > 0)
        ? Math.round(((req.creditos_emitidos - tetoAjustado) / tetoAjustado) * 10000) / 100
        : 0;

    const origem = req.registro_publico ? `[REGISTRO PÚBLICO: ${req.registro_publico.toUpperCase()}]` : `[AUDITORIA DIRETA]`;
    let status, laudo;

    if (req.creditos_emitidos === 0) {
        status = "VALIDADO (LIMITE FÍSICO DETERMINADO)";
        laudo = `${origem} [ESTADO: CAPACIDADE DEFINIDA] Auditoria concluída no ${regiaoNome}. Limite físico estabelecido em ${formatarNumero(tetoAjustado)} tCO2/ano para a área informada.`;
    } else if (balanco >= 0) {
        status = "CONFORME (METAS FÍSICAS CUMPRIDAS)";
        laudo = `${origem} [ESTADO: VALIDADO] O registro cumpriu integralmente as metas físicas no ${regiaoNome}. O volume de ${formatarNumero(req.creditos_emitidos)} tCO2 encontra-se dentro do limite suportado (${formatarNumero(tetoAjustado)} tCO2). Saldo líquido confirmado em ${formatarNumero(balanco)} tCO2.`;
    } else if (desvio > 0 && desvio <= 35.0) {
        status = "CUMPRIMENTO PARCIAL (DÉFICIT MODERADO)";
        laudo = `${origem} [ESTADO: CUMPRIMENTO PARCIAL] O volume (${formatarNumero(req.creditos_emitidos)} tCO2) excedeu o limite físico apurado (${formatarNumero(tetoAjustado)} tCO2) em ${desvio.toFixed(2)}%, gerando passivo não absorvido de ${formatarNumero(Math.abs(balanco))} tCO2.`;
    } else {
        status = "REJEITADO (META NÃO CUMPRIDA / PASSIVO OCULTO)";
        laudo = `${origem} [ESTADO: REJEITADO] Violação física severa no ${regiaoNome}. Volume de ${formatarNumero(req.creditos_emitidos)} tCO2 contra limite máximo de ${formatarNumero(tetoAjustado)} tCO2 (sobre-emissão de ${desvio.toFixed(2)}%). Passivo real de ${formatarNumero(Math.abs(balanco))} tCO2 contabilizado.`;
    }

    const resObj = {
        status_protocolo: status,
        indexador_regional: regiaoNome,
        teto_fisico_anual_t: tetoAjustado,
        balanco_auditado_t: balanco,
        desvio_percentual: desvio,
        laudo_tecnico: laudo,
        prova_criptografica_sha256: "CALCULANDO...",
        timestamp_utc: ts
    };

    gerarSHA256Hex(`BCA|${req.registro_publico}|${lat}|${lon}|${req.area_m2}|${req.creditos_emitidos}|${ts}`).then(h => {
        document.getElementById('resHash').innerText = h;
    });

    return resObj;
}
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
